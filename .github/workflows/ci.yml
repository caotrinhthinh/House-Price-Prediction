name: CI Pipeline

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─── Job 1: Node.js Backend Tests ────────────────────────────────────────
  backend-test:
    name: Backend Tests (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
          MODEL_SERVER_URL: "http://localhost:5000"

  # ─── Job 2: Python Model Server Tests ────────────────────────────────────
  python-model-test:
    name: Model Server Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: model-server/requirements.txt

      - name: Install Python dependencies
        working-directory: model-server
        run: pip install -r requirements.txt

      - name: Run Python tests
        working-directory: model-server
        run: pytest tests/ -v
        env:
          TESTING: "true"
          PYTHONPATH: "."

  # ─── Job 3: Frontend CI ──────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint Check
        working-directory: frontend
        run: npm run lint

      - name: Build Test
        working-directory: frontend
        run: npm run build
